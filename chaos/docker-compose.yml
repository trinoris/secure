# Chaos sandbox — specs/chaotests/01-sandbox.md.
#
# Run from the repository root: `npm run chaos:sandbox` (see chaos/README.md
# for the exact commands and why `remote` never exiting rules out a plain
# `docker compose up --abort-on-container-exit`).
#
# Topology: remote (bare repo, git://) <- collaborator-a, collaborator-b,
# code-agent, operator (legitimate actors — code-agent modeling an AI
# coding agent, same protections as any human collaborator, no special-
# casing anywhere in driver.mjs) <- chaos-4 "virus" paired with
# collaborator-a's HOME, chaos-6 "infra" paired with collaborator-b
# (shares its PID + network namespace too, so it can kill its subprocess
# and drop its network link, not just touch its files) <- chaos-5
# "attacker", an outsider with ordinary push access and no registered
# identity (chaos/agents/attacker.mjs), push-only, no access to any actor
# <- bad-agent, a DIFFERENT shape entirely
# (specs/chaotests/04-agent-threat-model.md): a genuinely registered,
# genuinely signing COLLABORATOR_ROLES member (driver.mjs) that is
# occasionally hijacked mid-task into one of four signed PI1-PI4 attacks —
# not an outsider, so it gets the same HOME/keyring/identity access as
# any legitimate collaborator. The `verifier` runs last, auditing a fresh
# clone of `remote` plus the shared run report.
#
# `operator` (collaborator-c / actor-3) deliberately gets no paired chaos
# agent in this v1 — a reasonable first scope, not an oversight (see
# specs/chaotests/01-sandbox.md). `code-agent` likewise has no paired
# chaos-4/chaos-6-style local-corruption agent of its own yet.

x-common-env: &common-env
  REMOTE_URL: git://remote/repo.git
  BRANCH: main
  SECUREGIT_PASSPHRASE: correct horse battery staple sandbox edition
  CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-300}
  REPORT_PATH: /report/report.jsonl
  SHARED_DIR: /shared
  # direct-master (W1, default) | working-branch (W2) | pr-gated (W3) —
  # specs/chaotests/03-orchestrator.md. Only `direct-master` matches
  # 01-sandbox.md's original single-branch design; the other two route
  # every non-orchestrator push through a branch `master` never accepts
  # updates to directly (remote/entrypoint.mjs's pre-receive hook).
  SANDBOX_WORKFLOW: ${SANDBOX_WORKFLOW:-direct-master}
  # basic (default) | advance — independent of SANDBOX_WORKFLOW above.
  # "advance" requires every push, on every ref the workflow doesn't
  # already refuse outright, to be signed by a fingerprint on the
  # protected branch's own recipient list (chaos/remote/pre-receive-check.mjs).
  # Crossed with all three workflows this gives six real, distinct modes —
  # e.g. SANDBOX_WORKFLOW=direct-master + SANDBOX_SIGNING=advance is what
  # was previously modeled as a separate `direct-master-signed` (W4)
  # workflow value; that's now just this same flag applied to any of the
  # three, not a fourth workflow name.
  SANDBOX_SIGNING: ${SANDBOX_SIGNING:-basic}

services:
  remote:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/remote/entrypoint.mjs"]
    expose:
      - "9418"
    environment:
      REPO_PATH: /repos/repo.git
      BRANCH: main
      SANDBOX_WORKFLOW: ${SANDBOX_WORKFLOW:-direct-master}
      SANDBOX_SIGNING: ${SANDBOX_SIGNING:-basic}
    volumes:
      # Also mounted (read-write) on `operator` under working-branch/
      # pr-gated, so it can land a reviewed merge via a direct `git
      # update-ref` against this exact bare repo — a privileged path that
      # never invokes `receive-pack` and so never runs the pre-receive
      # hook guarding `master` over the ordinary git:// protocol. See
      # remote/entrypoint.mjs's header comment.
      - remote-repo-data:/repos

  collaborator-a:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/actors/driver.mjs"]
    depends_on: [remote]
    environment:
      <<: *common-env
      SANDBOX_ROLE: collaborator-a
      HOME: /home/collaborator-a
      WORK_DIR: /work
    volumes:
      - report-data:/report
      - keyring-shared:/shared
      - home-actor1:/home/collaborator-a

  collaborator-b:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/actors/driver.mjs"]
    depends_on: [remote, collaborator-a]
    environment:
      <<: *common-env
      SANDBOX_ROLE: collaborator-b
      HOME: /home/collaborator-b
      WORK_DIR: /work
    volumes:
      - report-data:/report
      - keyring-shared:/shared
      - home-actor2:/home/collaborator-b

  # A third ordinary collaborator — same loop, same protections, same
  # signing requirements once SANDBOX_SIGNING=advance (driver.mjs's
  # COLLABORATOR_ROLES) — modeling an AI coding agent committing like any
  # other legitimate actor, with no special-casing anywhere in the driver.
  code-agent:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/actors/driver.mjs"]
    depends_on: [remote, collaborator-a]
    environment:
      <<: *common-env
      SANDBOX_ROLE: code-agent
      HOME: /home/code-agent
      WORK_DIR: /work
    volumes:
      - report-data:/report
      - keyring-shared:/shared
      - home-actor4:/home/code-agent

  operator:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/actors/driver.mjs"]
    depends_on: [remote, collaborator-a]
    environment:
      <<: *common-env
      SANDBOX_ROLE: operator
      HOME: /home/operator
      WORK_DIR: /work
      # Only used under working-branch/pr-gated (ignored, and mounted
      # harmlessly, under direct-master) — see remote's `volumes:` comment.
      REMOTE_REPO_PATH: /remote-repo/repo.git
    volumes:
      - report-data:/report
      - keyring-shared:/shared
      - home-actor3:/home/operator
      - remote-repo-data:/remote-repo

  chaos-4-virus:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/agents/virus.mjs"]
    depends_on: [collaborator-a]
    environment:
      SANDBOX_ROLE: chaos-4-virus
      SANDBOX_TARGET: collaborator-a
      HOME: /home/collaborator-a
      REPORT_PATH: /report/report.jsonl
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-300}
    volumes:
      - report-data:/report
      - home-actor1:/home/collaborator-a
    # Deliberately NOT mounted: keyring-shared. The virus tampers with
    # files already inside its target's HOME — it has no more reach than
    # that, and specifically no reason to touch the cross-actor exchange
    # volume (see specs/chaotests/01-sandbox.md's Scope guardrails).

  chaos-5-attacker:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/agents/attacker.mjs"]
    depends_on: [remote]
    environment:
      SANDBOX_ROLE: chaos-5-attacker
      REMOTE_URL: git://remote/repo.git
      BRANCH: main
      WORK_DIR: /work
      REPORT_PATH: /report/report.jsonl
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-300}
      SANDBOX_WORKFLOW: ${SANDBOX_WORKFLOW:-direct-master}
    volumes:
      - report-data:/report
    # No HOME/keyring volume of any kind — chaos-5 only ever has ordinary
    # push access to `remote`, exactly like a real hostile collaborator,
    # never any actor's local state or key material.

  # bad-agent — NOT chaos-5's shape. specs/chaotests/04-agent-threat-model.md:
  # a hijacked TRUSTED agent, not an outsider. Genuinely a COLLABORATOR_ROLES
  # member (driver.mjs) — real signing identity, really registered as a
  # recipient, real decrypt access — running the ordinary collaborator loop
  # on most rounds and one of four signed PI1-PI4 attacks
  # (hijackedAgentRound()) on the rest. The whole point is that the signing
  # check has nothing to say about any of them; what (if anything) catches
  # each is exactly what 04-agent-threat-model.md's own table answers.
  bad-agent:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/actors/driver.mjs"]
    depends_on: [remote, collaborator-a]
    environment:
      <<: *common-env
      SANDBOX_ROLE: bad-agent
      HOME: /home/bad-agent
      WORK_DIR: /work
    volumes:
      - report-data:/report
      - keyring-shared:/shared
      - home-actor5:/home/bad-agent

  chaos-6-infra:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/agents/infra.mjs"]
    depends_on: [collaborator-b]
    # Shares collaborator-b's PID namespace (to find and SIGKILL its
    # `securegit` subprocess by scanning /proc directly) and network
    # namespace (so an iptables DROP rule added here affects exactly
    # collaborator-b's own traffic to `remote`, nothing else's).
    pid: "service:collaborator-b"
    network_mode: "service:collaborator-b"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SANDBOX_ROLE: chaos-6-infra
      SANDBOX_TARGET: collaborator-b
      HOME: /home/collaborator-b
      REMOTE_HOST: remote
      REPORT_PATH: /report/report.jsonl
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-300}
      DISK_FILL_MB: ${DISK_FILL_MB:-64}
    volumes:
      - report-data:/report
      - home-actor2:/home/collaborator-b

  verifier:
    build:
      context: ..
      dockerfile: chaos/Dockerfile
    command: ["node", "/chaos/verifier/verify.mjs"]
    depends_on: [remote, collaborator-a]
    environment:
      REMOTE_URL: git://remote/repo.git
      BRANCH: main
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-300}
      VERIFIER_STARTUP_GRACE_SECONDS: ${VERIFIER_STARTUP_GRACE_SECONDS:-30}
      # The operator's post-loop finalIntegritySelfCheck() (see
      # chaos/actors/driver.mjs) decrypts every protected blob in history
      # before it finishes — its own real cost, on top of
      # CHAOS_DURATION_SECONDS, scaling with how much history the run
      # accumulated. 60s covers a default-length run comfortably; a much
      # longer CHAOS_DURATION_SECONDS should raise this too.
      VERIFIER_SETTLE_SECONDS: ${VERIFIER_SETTLE_SECONDS:-60}
      REPORT_PATH: /report/report.jsonl
      VERIFIER_RESULT_PATH: /report/verifier-result.json
    volumes:
      - report-data:/report
    # No HOME/keyring volume — the verifier only ever gets what a real
    # auditor with repository access (not a workstation) would have.

volumes:
  report-data: {}
  keyring-shared: {}
  home-actor1: {}
  home-actor2: {}
  home-actor3: {}
  home-actor4: {}
  home-actor5: {}
  remote-repo-data: {}
