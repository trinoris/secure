version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # This is a first-party workspace package. Its compatibility range is
      # changed deliberately alongside securelib releases, not by dependency
      # automation in each consumer package.
      - dependency-name: "@trinoris/securelib"
    groups:
      # vitest and @vitest/coverage-v8 must move together — the coverage
      # package's own major version has to match vitest's, not just be
      # semver-compatible with it. Bumping one alone (two separate PRs,
      # #8 and #10) broke `test:coverage` outright: coverage-v8@5 expects
      # vitest@5's internals and fails with "Cannot find package
      # '@vitest/coverage-v8'" against vitest still at 4.x. Grouping them
      # makes Dependabot open one combined PR instead of two independently
      # mergeable (but only jointly working) ones.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # These versions are shared across the workspace; update them in one PR
      # and run the full workspace gates once.
      shared-typescript-toolchain:
        patterns:
          - "@types/node"
          - "typescript"

  # Keeps the third-party Actions this repo now depends on (checkout,
  # setup-node, codeql-action, deploy-pages, gitleaks-action, ...) pinned
  # to current versions rather than silently drifting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
