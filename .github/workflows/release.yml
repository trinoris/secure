name: Release

# Triggered only by pushing a version tag — nothing here runs on an
# ordinary push to master. Bump BOTH packages/securelib/package.json's and
# packages/securegit/package.json's "version" (kept in lockstep — see the
# tag-verification step below), commit, then:
#   git tag v0.1.0 && git push --tags
#
# Since the extraction into @trinoris/securelib (docs/securegit/01-architecture.md): this is
# a two-package npm workspace, not one package. The root package.json is
# a private workspace root with no version of its own — it is never
# published, and `npm publish` is run per-workspace instead, in dependency
# order (securelib before securegit, since a freshly `npm install`ed
# securegit needs securelib to already be resolvable on the registry).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for `gh release create`
      packages: write   # for `npm publish` to this repo's own GitHub Packages

    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag matches both packages' versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          securelib_version=$(node -p "require('./packages/securelib/package.json').version")
          securegit_version=$(node -p "require('./packages/securegit/package.json').version")
          if [ "$tag_version" != "$securelib_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/securelib's version $securelib_version"
            exit 1
          fi
          if [ "$tag_version" != "$securegit_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/securegit's version $securegit_version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          # GitHub Packages, not the public npm registry — both packages'
          # publishConfig.registry already point here too; all three set,
          # which is the documented belt-and-suspenders pattern.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trinoris'

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

      - name: Publish @trinoris/securelib to GitHub Packages
        run: npm publish --workspace=packages/securelib
        env:
          # The default GITHUB_TOKEN can publish here because the repo now
          # lives under the same org (trinoris) as the package's own scope
          # (@trinoris) — GitHub Packages requires that match. No separate
          # PAT/secret needed, unlike when this repo was under a different
          # owner than the package scope.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @trinoris/securegit to GitHub Packages
        # After securelib, not in parallel — securegit's own package.json
        # dependency needs securelib already resolvable on the registry.
        run: npm publish --workspace=packages/securegit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
