name: Release

# Release from a SecureGit version tag. Workspace packages have independent
# versions; each package is published from its own manifest when unpublished.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify SecureGit package version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./packages/securegit/package.json').version")
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/securegit/package.json version $package_version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@trinoris'

      # Decrypt the real source before validating or building the release.
      - uses: ./.github/actions/decrypt-securegit

      - name: Run release gates and publish new package versions
        run: bash scripts/release.sh --tag "$GITHUB_REF_NAME"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
