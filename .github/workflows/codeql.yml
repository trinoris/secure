name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly, independent of any push — catches new CodeQL query-pack
    # findings against code that hasn't changed.
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      # This repo is real securegit ciphertext at rest outside the
      # plaintext-excluded paths (.gitattributes) — CodeQL needs the real
      # decrypted source to analyze, not opaque encrypted bytes. See
      # secret-pass-phrase.txt for why the decrypt key is published
      # openly rather than a CI secret.
      - uses: ./.github/actions/decrypt-securegit

      - run: npm ci

      # v4, not v3: v3 targets the Node 20 runner GitHub is deprecating
      # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/)
      # — v3 still ran, just forced onto Node 24 with a warning each time.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # Explicit build instead of the default autobuild — this repo's
      # build is a single known command (see package.json), no need for
      # CodeQL's build-step heuristics to guess it.
      - run: npm run build --if-present

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
