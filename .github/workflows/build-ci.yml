# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Nightly chaos-sandbox run — see the `chaos` job below for why this
    # stays off the push/PR path.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  # Independent of the build tree below — `npm audit` inspects the one
  # shared package-lock.json directly, no package needs to be built first.
  # This is the actual gate (fails the job on any high/critical finding
  # across the whole workspace); `metrics-badges` below runs it again
  # per-package, but only to report a number, never to block anything.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  # The build/test tree mirrors this repo's real package dependency graph
  # (packages/securelib-piv and packages/securelib-fido2 both peerDepend
  # on @trinoris/securelib; packages/securegit depends on it) rather than
  # one job doing all four sequentially: securelib builds and tests first
  # since the other three need its build output (dist/) to even type-check
  # against, then the three leaves build/test in parallel once it's green.
  # Each downstream job re-runs `build:securelib` itself rather than
  # sharing dist/ via an artifact — a plain `tsc` compile is a few seconds,
  # cheaper than wiring artifact upload/download for it, and every job
  # stays runnable standalone (e.g. via `workflow_dispatch` re-runs of just
  # one job) without depending on another job's artifact still existing.
  build-securelib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build:securelib
      # securelib's own registry.test.ts genuinely dynamic-imports the
      # real, installed @trinoris/securelib-piv/-fido2 packages (see that
      # file's own comment) to prove loadProvider()'s dynamic-import path
      # against real companion packages, not just a mock — a real, if
      # inverted, *test-time* dependency the package-dependency graph
      # itself doesn't have. Both must be built before this job's own
      # test:coverage step below, or that test fails with "not installed".
      - run: npm run build:securelib-piv
      - run: npm run build:securelib-fido2
      - run: npm run typecheck --workspace=packages/securelib
      # `test:coverage` runs the exact same tests `test` would, plus v8
      # coverage instrumentation — this package's own vitest.config.ts sets
      # `coverage.thresholds.branches: 90`, so vitest itself exits nonzero
      # (failing this step) the moment its real branch coverage drops
      # below that bar. That failure *is* the coverage gate for this
      # package; there's no separate check to add beyond running this
      # instead of the uninstrumented `test`.
      - run: npm run test:coverage --workspace=packages/securelib

  build-securelib-piv:
    needs: build-securelib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build:securelib
      - run: npm run build:securelib-piv
      - run: npm run typecheck --workspace=packages/securelib-piv
      - run: npm run test:coverage --workspace=packages/securelib-piv

  build-securelib-fido2:
    needs: build-securelib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build:securelib
      - run: npm run build:securelib-fido2
      - run: npm run typecheck --workspace=packages/securelib-fido2
      - run: npm run test:coverage --workspace=packages/securelib-fido2

  build-securegit:
    needs: build-securelib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build:securelib
      - run: npm run build --workspace=packages/securegit
      - run: npm run typecheck --workspace=packages/securegit
      - run: npm run test:coverage --workspace=packages/securegit

  # Generates the README's coverage and audit badge data (shields.io
  # "endpoint badge" JSON files — https://shields.io/badges/endpoint-badge)
  # and hands them to `chaos-publish` below to include in the Pages site
  # it deploys. Deliberately on the same nightly/manual cadence as
  # `chaos`, not on every push/PR: this repo's one GitHub Pages site is
  # already fully replaced by `chaos-publish` every time it deploys (see
  # that job's own comments on why it always assembles a complete site
  # from scratch each run), so a push-triggered badge deploy would just
  # make the chaos dashboard disappear until the next nightly run
  # re-published it. The coverage and audit *gates* (the build-tree jobs'
  # own test:coverage steps, and `audit` above) already run on every
  # push/PR regardless — this job only affects how often the README's
  # displayed numbers refresh, so it re-runs its own full build+test+audit
  # rather than pulling artifacts out of the (unrelated-cadence) gate jobs.
  metrics-badges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - run: mkdir -p badges
      # One coverage badge per package (coverage-badge-<pkg>.json) plus
      # one aggregate (coverage-badge.json) — see generate-coverage-badge.mjs.
      - run: npm run coverage:badge -- badges
      # One audit badge per package (audit-badge-<pkg>.json) — see
      # generate-audit-badge.mjs. Reporting only (see that script's own
      # header comment for why `audit` above, not this, is the real gate).
      - run: npm run audit:badge -- badges
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-badges-${{ github.run_id }}
          path: badges/

  # Runs the Docker Compose chaos sandbox (chaos/docker-compose.yml, see
  # specs/chaotests/01-sandbox.md) once per combination of two independent
  # axes this project models (specs/chaotests/03-orchestrator.md):
  #   - workflow: direct-master (W1, no gate at all), working-branch (W2,
  #     gated only at the promotion to master), pr-gated (W3, every change
  #     reviewed before master ever moves)
  #   - signing: basic (off, the original pre-signing behavior) | advance
  #     (every push, to every ref the workflow doesn't already refuse
  #     outright, must be signed by a registered recipient)
  # GitHub Actions crosses two matrix arrays automatically — 3 x 2 = 6
  # real, distinct legs, `fail-fast: false` since one leg's expected red
  # must never cancel the others mid-run. `chaos-publish` (below)
  # assembles all six legs' results into one Pages site regardless of
  # which legs failed.
  #
  # Deliberately nightly + manual only, never on push/PR: this is a several-
  # minute, fuzzing-campaign-style run ("reported, not scored" per
  # specs/chaotests/01-sandbox.md), not a fast deterministic gate, and it's
  # new enough (two real bugs found and fixed in the sandbox itself the
  # first time it was actually run) that it shouldn't block merges yet.
  chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workflow: [direct-master, working-branch, pr-gated]
        signing: [basic, advance]
    env:
      CHAOS_DURATION_SECONDS: 180
      VERIFIER_STARTUP_GRACE_SECONDS: 20
      VERIFIER_SETTLE_SECONDS: 60
      SANDBOX_WORKFLOW: ${{ matrix.workflow }}
      SANDBOX_SIGNING: ${{ matrix.signing }}
    steps:
      - uses: actions/checkout@v7

      - name: Run the chaos sandbox (${{ matrix.workflow }}, ${{ matrix.signing }})
        run: |
          docker compose -f chaos/docker-compose.yml up --build -d
          # `wait` exits with verifier's own exit code — a hard-invariant
          # violation (or any other reason verifier itself exits nonzero)
          # must NOT abort this step under -e, or every step below that's
          # `if: always()` for exactly this reason (publish a failing run,
          # not just a passing one) never gets anything to publish, and the
          # underlying failure's own report/logs are lost for good once the
          # runner tears down. The actual pass/fail signal comes from
          # verifier-result.json itself, in the last step below.
          docker compose -f chaos/docker-compose.yml wait verifier || true

      - name: Extract the run's report and audit
        if: always()
        run: |
          mkdir -p site
          docker compose -f chaos/docker-compose.yml logs verifier > verifier.log || true
          docker compose -f chaos/docker-compose.yml run --rm --no-deps verifier cat /report/report.jsonl > site/report.jsonl || true
          docker compose -f chaos/docker-compose.yml run --rm --no-deps verifier cat /report/verifier-result.json > site/verifier-result.json || true

      - name: Tear down
        if: always()
        run: docker compose -f chaos/docker-compose.yml down -v

      # Always publish, pass or fail — a violation is exactly the
      # interesting result this exists to surface, not one to hide.
      # A plain (non-Pages) artifact per leg — `chaos-publish` assembles
      # all six into the one site actually deployed.
      - name: Upload this leg's raw run artifacts (report, audit, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-result-${{ matrix.workflow }}-${{ matrix.signing }}-${{ github.run_id }}
          path: |
            site/report.jsonl
            site/verifier-result.json
            verifier.log

      # Last step, deliberately: publishing above must happen regardless
      # of outcome. Failing here just makes a violated run show red on the
      # schedule/dispatch history, for *this leg only* (`fail-fast: false`
      # keeps the other legs running and publishing regardless) — see the
      # job comment for why this can never affect a push/PR run's status,
      # and specs/chaotests/03-orchestrator.md's "Predicted plaintext-leak
      # shape" table for which legs are expected to fail. Job status here
      # is "did the sandbox produce a trustworthy result", not "did an
      # invariant hold" — those are the same question only for `pr-gated`,
      # the one workflow with a review gate at all, in *either* signing
      # tier: branch isolation and content review already make it hold on
      # their own (pr-gated+basic, this project's original, long-confirmed
      # finding), and pr-gated+advance only adds defense-in-depth on top
      # of that, never removes it. Every other combination violating an
      # invariant is the expected, unsurprising result of having no
      # content-review gate (specs/chaotests/03-orchestrator.md's whole
      # comparison exists to show exactly that) — real data for the
      # viewer to display, not a build failure to page anyone over.
      # `pr-gated` failing THE REVIEW GATE ITSELF — something landing on
      # `master` that should have been refused (a hostile recipient, an
      # attribute downgrade, structural damage, data loss) — is the one
      # genuinely alarming case: a real regression in the review logic,
      # and stays a hard job failure.
      #
      # `noPlaintextLeaked` alone is a narrower thing than that, and
      # `pr-gated` is NOT unconditionally exempt from it — see
      # specs/chaotests/04-agent-threat-model.md's "self-poisoning" finding
      # (real CI runs 34041479353, both signing tiers): `bad-agent`
      # (unlike chaos-5, which only ever attacks and never does ordinary
      # work of its own) runs an ordinary collaborator loop on its OWN
      # isolated feature branch too. Once its PI1 attribute-downgrade
      # attack fires on that branch, `bad-agent`'s own SUBSEQUENT ordinary
      # commits on that same still-checked-out branch land as genuine
      # plaintext — never merged (the review gate still catches and
      # refuses the downgrade at merge time; `master`'s own history stays
      # clean in every observed run), but still reachable in the remote's
      # overall history the moment it's pushed, same as any branch on a
      # shared remote. `master` staying clean was always the actual
      # guarantee W3's branch isolation provides ("each role's own branch
      # isolated from every OTHER role's" — 03-orchestrator.md); it was
      # never a guarantee that an attacker can't poison its OWN branch's
      # own subsequent history, which is a new possibility now that an
      # attacker-shaped role also does real ongoing work. So: hard-fail
      # only on the four checks that are actually scoped to `master`
      # (`BRANCH` in verify.mjs) — `repositoryIntact`, `zeroDataLoss`,
      # `hostileRecipients.count`, `attributesFinalState.containsFilter` —
      # and warn (not fail) on `noPlaintextLeaked` alone, matching the
      # non-pr-gated legs below.
      #
      # The four non-pr-gated legs (direct-master and working-branch,
      # crossed with both signing tiers) all stay in the warning tier —
      # the "advance" legs among them are newer and less battle-tested
      # than pr-gated's own long confirmation history (every local run so
      # far has held clean, per specs/chaotests/03-orchestrator.md's
      # "Since then" note, but that's local-only so far); revisit once
      # they've earned the same real-run history.
      - name: Check whether a hard invariant was violated
        if: always()
        run: |
          if [ ! -s site/verifier-result.json ]; then
            echo "::error::verifier-result.json is missing or empty — the sandbox run itself failed before producing a result (see the 'Run the chaos sandbox' step and verifier.log in the uploaded artifact, if any)."
            exit 1
          fi
          held=$(jq -r '.hardInvariantsHeld' site/verifier-result.json)
          echo "hardInvariantsHeld=$held"
          if [ "$held" != "true" ]; then
            if [ "${{ matrix.workflow }}" = "pr-gated" ]; then
              reviewGateHeld=$(jq -r '(.invariants.repositoryIntact and .invariants.zeroDataLoss and (.hostileRecipients.count == 0) and .attributesFinalState.containsFilter)' site/verifier-result.json)
              if [ "$reviewGateHeld" != "true" ]; then
                echo "::error::A hard invariant was violated ON MASTER ITSELF under pr-gated (${{ matrix.signing }}) — the review gate is expected to always prevent this; see the deployed viewer or verifier.log for what actually happened."
                exit 1
              fi
              echo "::warning::Plaintext reached the remote's overall reachable history under pr-gated (${{ matrix.signing }}), but master's own history stayed clean — expected once an attacker-shaped role (bad-agent) also does ordinary work on its own isolated branch and self-poisons it; see specs/chaotests/04-agent-threat-model.md's self-poisoning finding and the deployed viewer for the actual result."
            else
              echo "::warning::A hard invariant was violated under ${{ matrix.workflow }} (${{ matrix.signing }}) — expected for a combination with no content-review gate; see the deployed viewer for the actual result, this job's status intentionally doesn't reflect it."
            fi
          fi

  # Assembles all six matrix legs' results into one site and publishes it
  # — `if: always()` because every non-pr-gated leg failing its own
  # invariant check above is the expected, interesting result this whole
  # comparison exists to surface, never a reason to skip publishing it.
  chaos-publish:
    needs: [chaos, metrics-badges]
    # `chaos` itself only runs on schedule/workflow_dispatch (see its own
    # `if:` above) — every ordinary push/PR run has `chaos.result ==
    # 'skipped'`, and `always()` alone doesn't exclude that. Confirmed by
    # a real run (33957549388, triggered by an ordinary push): without
    # this, chaos-publish ran anyway with zero downloaded artifacts,
    # assembled a site with three empty mode subfolders, and deploy-pages
    # published *that*, silently wiping out the last real comparison.
    #
    # Deliberately keyed on `chaos` alone, not `metrics-badges` — the
    # chaos dashboard is this job's primary content and must still publish
    # even if the badge step failed; the badge copy below is best-effort
    # (falls back to leaving the badges out of this deploy, not to failing
    # the whole site).
    if: always() && needs.chaos.result != 'skipped' && needs.chaos.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Download every workflow's results
        uses: actions/download-artifact@v8
        with:
          pattern: chaos-result-*-${{ github.run_id }}
          path: downloaded

      - name: Download the coverage/audit badges
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: metrics-badges-${{ github.run_id }}
          path: downloaded-badges

      - name: Assemble the comparison site
        run: |
          mkdir -p site
          cp chaos/viewer/index.html site/index.html
          if compgen -G "downloaded-badges/*.json" > /dev/null; then
            cp downloaded-badges/*.json site/
          else
            echo "::warning::no badge*.json files were downloaded — the metrics-badges job likely failed; the README's coverage/audit badges will 404 until the next successful run republishes them."
          fi
          for workflow in direct-master working-branch pr-gated; do
            for signing in basic advance; do
              mode="$workflow-$signing"
              mkdir -p "site/$mode"
              src="downloaded/chaos-result-$mode-${{ github.run_id }}"
              if [ -d "$src" ]; then
                # The uploading step (matrix leg's "Upload this leg's raw
                # run artifacts") lists `site/report.jsonl` and
                # `site/verifier-result.json` alongside a *sibling*
                # `verifier.log` (not under `site/`) — upload-artifact takes
                # the common ancestor of all listed paths as the archive
                # root, which is the workspace root here (verifier.log isn't
                # under site/), so the downloaded artifact keeps the `site/`
                # prefix rather than flattening it away. Confirmed by a real
                # run (33955584166) where this cp silently found nothing
                # (redirected to /dev/null) and every mode's page loaded an
                # empty comparison.
                cp "$src"/site/report.jsonl "site/$mode/report.jsonl" 2>/dev/null || true
                cp "$src"/site/verifier-result.json "site/$mode/verifier-result.json" 2>/dev/null || true
              else
                echo "::warning::no results downloaded for $mode (that matrix leg likely never completed the 'Run the chaos sandbox' step)"
              fi
            done
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: chaos-publish
    if: always() && needs.chaos-publish.result != 'skipped' && needs.chaos-publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
